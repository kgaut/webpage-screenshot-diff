name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint & format check (Biome)
        run: npm run check

      - name: Type-check & build backend
        run: npm run build:server

      - name: Build SPA
        run: npm run --prefix web build

      - name: Run unit tests
        run: npm test
